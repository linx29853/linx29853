name: Contributions calendar

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/generate_calendar.py"

permissions:
  contents: write

concurrency:
  group: contributions-calendar
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate recent 90-day contributions calendar
        run: python .github/scripts/generate_calendar.py
      - name: Publish calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.plugin.isocalendar.fullyear.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update recent 90-day contributions calendar [skip ci]"
          git push
